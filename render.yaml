services:
  - type: web
    name: maison-aurelia
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k gthread -w 1 --threads 100 --timeout 120 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: CURRENCY
        value: "$"
      - key: TAX_PERCENT
        value: "5"
      - key: RESERVATION_FEE
        value: "10"
      - key: ANTHROPIC_API_KEY
        sync: false
